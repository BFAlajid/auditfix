name: 'auditfix Security Scan'
description: 'Run auditfix security audit and optionally create fix PRs'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  severity:
    description: 'Minimum severity threshold (critical, high, medium, low)'
    required: false
    default: 'low'
  production-only:
    description: 'Only flag production vulnerabilities'
    required: false
    default: 'false'
  auto-fix:
    description: 'Automatically apply safe fixes and create a PR'
    required: false
    default: 'false'
  sarif:
    description: 'Generate SARIF output for GitHub Code Scanning'
    required: false
    default: 'false'
  working-directory:
    description: 'Directory to scan'
    required: false
    default: '.'
  webhook-url:
    description: 'Webhook URL for notifications (Slack or generic)'
    required: false

outputs:
  vulnerabilities:
    description: 'Number of vulnerabilities found'
    value: ${{ steps.scan.outputs.vulns }}
  exit-code:
    description: 'Exit code (0=clean, 1=vulns found, 2=error)'
    value: ${{ steps.scan.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Install auditfix
      shell: bash
      run: npm install -g auditfix@latest

    - name: Run security scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ARGS="--ci"
        if [ "${{ inputs.production-only }}" = "true" ]; then
          ARGS="$ARGS --prod-only"
        fi
        if [ "${{ inputs.severity }}" != "low" ]; then
          ARGS="$ARGS --severity ${{ inputs.severity }}"
        fi
        if [ -n "${{ inputs.webhook-url }}" ]; then
          ARGS="$ARGS --webhook ${{ inputs.webhook-url }}"
        fi
        if [ "${{ inputs.sarif }}" = "true" ]; then
          npx auditfix --sarif > auditfix-results.sarif || true
        fi

        set +e
        OUTPUT=$(npx auditfix $ARGS 2>&1)
        EXIT_CODE=$?
        set -e

        echo "$OUTPUT"
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

        # Count vulns from JSON output
        VULNS=$(echo "$OUTPUT" | jq -r '.vulnerabilities | length' 2>/dev/null || echo "0")
        echo "vulns=$VULNS" >> $GITHUB_OUTPUT

        exit $EXIT_CODE

    - name: Upload SARIF
      if: inputs.sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.working-directory }}/auditfix-results.sarif
      continue-on-error: true

    - name: Auto-fix and create PR
      if: inputs.auto-fix == 'true' && steps.scan.outputs.exit_code == '1'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx auditfix --fix --create-pr
      env:
        GH_TOKEN: ${{ github.token }}
