name: 'auditfix Security Scan'
description: 'Production-aware npm dependency security scanner with EPSS scoring, supply chain detection, and actionable fixes'
author: 'BFAlajid'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  severity:
    description: 'Minimum severity threshold (critical, high, medium, low)'
    required: false
    default: 'low'
  fail-on:
    description: 'Exit code strategy: production-critical, production-high, any, none'
    required: false
    default: 'any'
  production-only:
    description: 'Only report production vulnerabilities'
    required: false
    default: 'false'
  working-directory:
    description: 'Directory to scan'
    required: false
    default: '.'
  sarif:
    description: 'Generate and upload SARIF to GitHub Code Scanning'
    required: false
    default: 'true'
  sarif-category:
    description: 'Category for SARIF upload (for matrix builds)'
    required: false
    default: 'auditfix'
  pr-comment:
    description: 'Post scan summary as PR comment'
    required: false
    default: 'true'
  json-output:
    description: 'Write JSON report to this file path'
    required: false
  check-typosquats:
    description: 'Detect typosquatting packages'
    required: false
    default: 'false'
  check-provenance:
    description: 'Verify npm provenance attestations'
    required: false
    default: 'false'
  scan-behavior:
    description: 'Scan for suspicious behavior patterns'
    required: false
    default: 'false'
  webhook-url:
    description: 'Webhook URL for notifications (Slack/Teams/Discord/generic). Pass as a secret, never inline: webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}'
    required: false
  version:
    description: 'auditfix version (default: latest)'
    required: false
    default: 'latest'

outputs:
  vulnerability-count:
    description: 'Total vulnerabilities found'
  critical-count:
    description: 'Critical vulnerabilities'
  high-count:
    description: 'High vulnerabilities'
  production-count:
    description: 'Production vulnerabilities'
  fixable-count:
    description: 'Fixable vulnerabilities'
  sarif-file:
    description: 'Path to SARIF file'
  exit-code:
    description: 'Scan exit code'

runs:
  using: 'node20'
  main: 'dist/action/index.js'
