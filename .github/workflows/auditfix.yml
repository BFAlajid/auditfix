name: Security Audit (auditfix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'

permissions:
  security-events: write
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build auditfix
        run: npm run build

      - name: Run auditfix
        run: |
          node dist/index.js --sarif > auditfix-results.sarif 2>/dev/null || true
          if [ ! -s auditfix-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"auditfix","version":"1.0.1","informationUri":"https://github.com/BFAlajid/auditfix"}},"results":[]}]}' > auditfix-results.sarif
          fi

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: auditfix-results.sarif
          category: dependency-audit
